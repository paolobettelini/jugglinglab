[workspace]
members = [
    "crates/juggling-core",
    "crates/juggling-web",
    "crates/juggling-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.5", features = ["derive", "env"] }
console_error_panic_hook = "0.1.7"
color_quant = "1.1.0"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
gif = "0.14.2"
good_lp = { version = "1.15.2", default-features = false, features = ["microlp"] }
js-sys = "0.3.103"
leptos = { version = "0.9.0-alpha", features = ["csr"] }
mime_guess = "2.0.5"
roxmltree = "0.20.0"
regex = "1"
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-futures = "0.4.56"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread"] }
wasm-bindgen = "0.2.126"
web-sys = "0.3.103"

[[workspace.metadata.leptos]]
name = "jugglinglab"
bin-package = "juggling-server"
lib-package = "juggling-web"
output-name = "juggling_web"
site-root = "dist"
site-pkg-dir = "pkg"
assets-dir = "public"
style-file = "public/app.css"
site-addr = "0.0.0.0:8080"
reload-port = 3001
browserquery = "defaults"
bin-cargo-command = "bash scripts/cargo-leptos-server.sh"
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
